<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Card</title>
    <link rel="stylesheet" href="Youtube-Thumbnail-Card-Project.css">
</head>
<body>

    <div class="card">

        <div class="thumbnail">
            <img src="birds.avif"
                 alt="Birds">
        </div>

        <div class="content">

            <div class="profile">
                <img src="logo.jpg" alt="Profile">
            </div>

            <div class="details">
                <h2>
                    You Can't Watch This Without Smiling -
                    Budgies Taking a Bath
                </h2>

                <p class="channel">
                    Mathesh Creations
                </p>

                <p class="views">
                    300K views • 5 months ago
                </p>
            </div>

        </div>

    </div>

</body>
</html>
